name: Build Microsoft Store MSIX

on:
  push:
    branches:
      - codex/microsoft-store
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Expected a vMajor.Minor.Patch tag.' }
            $version = $Matches[1]
          } else {
            $version = (dotnet msbuild MonitorHop/MonitorHop.csproj -getProperty:Version).Trim()
          }
          ./tools/BuildStorePackage.ps1 -IdentityName 'danilyu4ka.MonitorHop' -Publisher 'CN=74354B7E-1810-49B4-A285-60F3FBB99F1A' -PublisherDisplayName 'danilyu4ka' -AppDisplayName 'MonitorHop' -Version $version
      - name: Upload package and listing logo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitorhop-store-msix
          path: |
            artifacts/store/*.msix
            artifacts/store/SHA256SUMS.txt
            artifacts/store/Store-listing-logo-300x300.png
          if-no-files-found: error
