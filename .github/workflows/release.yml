name: Build Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish installed application without runtime extraction
        shell: pwsh
        run: |
          dotnet publish MonitorHop/MonitorHop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:NuGetAudit=false --ignore-failed-sources -o install-payload
      - name: Build classic per-user setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler is missing: $iscc" }
          & $iscc installer/MonitorHop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable single-file executable
        shell: pwsh
        run: |
          dotnet publish MonitorHop/MonitorHop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:NuGetAudit=false --ignore-failed-sources -o release
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = @('release/MonitorHop-Setup.exe', 'release/MonitorHop.exe')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Create release with installer and portable executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/MonitorHop-Setup.exe release/MonitorHop.exe release/SHA256SUMS.txt --verify-tag --title "MonitorHop $env:GITHUB_REF_NAME" --notes "Classic per-user installer (Inno Setup), English/Russian/Estonian, plus portable Windows x64 executable and SHA-256 checksums."
