name: Build Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Resolve one version for the application and installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Release tag must look like v1.5.1: $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
          } else {
            $version = (dotnet msbuild MonitorHop/MonitorHop.csproj -getProperty:Version).Trim()
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid version: $version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish installed application without runtime extraction
        shell: pwsh
        run: |
          dotnet publish MonitorHop/MonitorHop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o install-payload
      - name: Build classic per-user setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler is missing: $iscc" }
          & $iscc "/DAppVer=$env:APP_VERSION" installer/MonitorHop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable single-file executable
        shell: pwsh
        run: |
          dotnet publish MonitorHop/MonitorHop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o release
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = @('release/MonitorHop-Setup.exe', 'release/MonitorHop.exe')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Smoke test per-user install, running update, and uninstall
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/SmokeTestInstaller.ps1
      - name: Save release files for the publishing job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitorhop-release
          path: |
            release/MonitorHop-Setup.exe
            release/MonitorHop.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monitorhop-release
          path: release
      - name: Create release with installer and portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/MonitorHop-Setup.exe release/MonitorHop.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "MonitorHop $env:GITHUB_REF_NAME" --notes "Classic per-user installer (Inno Setup), English/Russian/Estonian, plus portable Windows x64 executable and SHA-256 checksums."
