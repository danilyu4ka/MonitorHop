name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish MonitorHop/MonitorHop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:NuGetAudit=false --ignore-failed-sources -o release
          Copy-Item release/MonitorHop.exe release/MonitorHop-Setup.exe
      - name: Create release with installer and portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/MonitorHop-Setup.exe release/MonitorHop.exe --verify-tag --title "MonitorHop $env:GITHUB_REF_NAME" --notes "Classic setup wizard with English, Russian and Estonian. Windows x64, self-contained."
